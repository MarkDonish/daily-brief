<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Brief · 每日资讯</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
:root {
  --ink: #1a1a2e;
  --ink-muted: #6b7280;
  --ink-light: #9ca3af;
  --paper: #fafaf9;
  --paper-card: #ffffff;
  --accent: #6366f1;
  --border: #e5e7eb;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #f5f5f4;
    --ink-muted: #a1a1aa;
    --ink-light: #71717a;
    --paper: #0c0a09;
    --paper-card: #1c1917;
    --border: #27272a;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 24px;
}
.hero { text-align: center; margin-bottom: 48px; }
.hero-brand {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 12px;
}
.hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.hero p {
  font-size: 15px;
  color: var(--ink-muted);
  max-width: 480px;
  margin: 0 auto;
}
.list { width: 100%; max-width: 640px; }
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.list-item:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(99,102,241,0.06);
}
.list-date {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 500;
}
.list-arrow {
  font-size: 18px;
  color: var(--ink-light);
  transition: color 0.15s, transform 0.15s;
}
.list-item:hover .list-arrow {
  color: var(--accent);
  transform: translateX(4px);
}
.footer {
  margin-top: auto;
  padding-top: 48px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-light);
  text-align: center;
}
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-brand">Daily Brief</div>
    <h1>每日资讯</h1>
    <p>AI · 创业 · 投资 · 科技 · 每日自动聚合</p>
  </div>
  <div class="list">
    <a href="2026-05-28.html" class="list-item">
  <span class="list-date">2026-05-28</span>
  <span class="list-arrow">→</span>
</a>

  </div>
  <div class="footer">
    Powered by Hermes Agent · Updated daily
  </div>
</body>
</html>
